[project]
name = "fashion-trend-detection"
version = "0.1.0"
description = "Google Trends を用いたファッショントレンドの EN→JP 波及タイミング推定"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "japanize-matplotlib>=1.1.3",
    "jupyterlab>=4.5.6",
    "kaleido>=1.2.0",
    "markdown>=3.10.2",
    "nbconvert>=7.17.0",
    "plotly>=6.6.0",
    "prophet>=1.3.0",
    "pytrends>=4.9.2",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]
